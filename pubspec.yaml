name: driver_app
description: "AMN Driver - Companion on-demand delivery driver mobile application."
publish_to: 'none'

version: 1.0.8+11

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  dio: ^5.9.2
  cookie_jar: ^4.0.9
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  connectivity_plus: ^7.0.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  intl: ^0.20.2
  logger: ^2.7.0
  flutter_svg: ^2.0.10+1
  auto_size_text: ^3.0.0
  socket_io_client: ^3.1.6
  geolocator: 14.1.1
  gebeta_gl: 0.22.4
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  awesome_notifications: ^0.12.1
  flutter_ringtone_player_plus: ^1.0.0
  vibration: ^3.2.1
  battery_plus: ^7.1.2
  device_info_plus: ^13.3.0
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.1
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  googleapis: ^17.0.0
  googleapis_auth: ^2.3.3
  http: ^1.2.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"

