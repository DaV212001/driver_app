name: Record App Store Review Demo (iOS Simulator)

on:
  workflow_dispatch:
    inputs:
      simulator_device:
        description: 'iOS Simulator Device'
        required: true
        default: 'iPhone 16'
        type: string

jobs:
  record-demo:
    name: Record Demo Video on iOS Simulator
    runs-on: macos-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Environment
        run: |
          flutter --version
          xcodebuild -version
          xcrun simctl list devices available

      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            echo "Installing FFmpeg via Homebrew..."
            brew install ffmpeg || true
          fi
          command -v ffmpeg || echo "FFmpeg installation failed, fallback to raw simulator video will be used"

      - name: Install Dependencies
        run: flutter pub get

      - name: CocoaPods Install
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Boot Simulator & Clean Status Bar
        id: boot-sim
        run: |
          DEVICE_NAME="${{ inputs.simulator_device }}"
          echo "Finding simulator for: $DEVICE_NAME"
          DEVICE_UDID=$(xcrun simctl list devices available | grep -E "$DEVICE_NAME \(" | head -n 1 | awk -F '[()]' '{print $2}')
          if [ -z "$DEVICE_UDID" ]; then
            echo "Fallback to first available iPhone simulator"
            DEVICE_UDID=$(xcrun simctl list devices available | grep -E "iPhone " | head -n 1 | awk -F '[()]' '{print $2}')
          fi
          echo "Selected UDID: $DEVICE_UDID"
          xcrun simctl boot "$DEVICE_UDID"
          echo "sim_udid=$DEVICE_UDID" >> "$GITHUB_OUTPUT"

          # Apple aesthetic clean status bar: 9:41 AM, 100% battery, full Wi-Fi
          xcrun simctl status_bar "$DEVICE_UDID" override \
            --time "9:41" \
            --dataNetwork "wifi" \
            --wifiMode "active" \
            --wifiBars 3 \
            --cellularMode "active" \
            --cellularBars 4 \
            --batteryState "charged" \
            --batteryLevel 100

      - name: Pre-build & Pre-grant Simulator Permissions
        run: |
          UDID="${{ steps.boot-sim.outputs.sim_udid }}"
          echo "Pre-building iOS simulator app..."
          flutter build ios --simulator --no-codesign

          echo "Installing Runner.app onto simulator $UDID..."
          xcrun simctl install "$UDID" build/ios/iphonesimulator/Runner.app

          echo "Pre-granting ALL privacy permissions to com.amn.driverApp..."
          xcrun simctl privacy "$UDID" grant all com.amn.driverApp || true
          xcrun simctl privacy "$UDID" grant location com.amn.driverApp || true
          xcrun simctl privacy "$UDID" grant location-always com.amn.driverApp || true
          xcrun simctl privacy "$UDID" grant photos com.amn.driverApp || true
          xcrun simctl privacy "$UDID" grant camera com.amn.driverApp || true

      - name: Run Integration Test & Record Screen
        run: |
          UDID="${{ steps.boot-sim.outputs.sim_udid }}"
          RAW_VIDEO="/tmp/raw_demo.mp4"

          # Re-affirm privacy permissions
          xcrun simctl privacy "$UDID" grant location-always com.amn.driverApp || true
          xcrun simctl privacy "$UDID" grant location com.amn.driverApp || true

          # Background watcher: wait until the app actually launches on the simulator before starting recording
          (
            echo "Recording daemon: Waiting for AMN Driver app to launch on simulator..."
            while ! xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -q "com.amn.driverApp" && ! pgrep -f "Runner.app/Runner" >/dev/null 2>&1; do
              sleep 0.5
            done
            echo "AMN Driver App process detected! Starting screen recording NOW..."
            xcrun simctl io "$UDID" recordVideo --codec=h264 "$RAW_VIDEO"
          ) &
          DAEMON_PID=$!
          echo "Recorder daemon running with PID: $DAEMON_PID"

          echo "Running Flutter Integration Test..."
          set +e
          flutter test integration_test/app_review_demo_test.dart -d "$UDID"
          TEST_EXIT_CODE=$?
          set -e

          echo "Test finished with exit code: $TEST_EXIT_CODE. Stopping recorder..."
          kill -INT $(pgrep -f "recordVideo") 2>/dev/null || true
          kill -INT "$DAEMON_PID" 2>/dev/null || true
          sleep 4

          if [ ! -f "$RAW_VIDEO" ]; then
            echo "Error: Video recording was not generated!"
            exit 1
          fi

          echo "Raw video generated successfully! Size: $(ls -lh "$RAW_VIDEO" | awk '{print $5}')"

      - name: Finalize & Compress Demo Video (< 30 MB Guaranteed)
        run: |
          RAW_VIDEO="/tmp/raw_demo.mp4"
          OUTPUT_VIDEO="amn_driver_review_demo.mp4"

          if command -v ffmpeg >/dev/null 2>&1; then
            echo "Optimizing video with ffmpeg to constant 30 FPS..."
            ffmpeg -y -i "$RAW_VIDEO" \
              -vf "fps=30,scale=1080:-2:flags=lanczos" \
              -c:v libx264 \
              -crf 24 \
              -preset medium \
              -profile:v high \
              -pix_fmt yuv420p \
              -movflags +faststart \
              -an \
              "$OUTPUT_VIDEO"
          else
            echo "ffmpeg not available, using raw simulator video directly (already H.264 mp4)"
            cp "$RAW_VIDEO" "$OUTPUT_VIDEO"
          fi

          FINAL_SIZE_BYTES=$(wc -c < "$OUTPUT_VIDEO")
          FINAL_SIZE_MB=$((FINAL_SIZE_BYTES / 1048576))
          echo "Final video ready: $OUTPUT_VIDEO (${FINAL_SIZE_MB} MB)"

          if [ "$FINAL_SIZE_MB" -ge 30 ]; then
            echo "Error: Video size exceeds 30MB limit!"
            exit 1
          fi

      - name: Upload Demo Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: amn-driver-review-demo
          path: amn_driver_review_demo.mp4
          retention-days: 14
