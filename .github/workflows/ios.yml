name: iOS Build & Verification

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build target'
        required: true
        default: 'simulator'
        type: choice
        options:
          - simulator
          - release-no-codesign

jobs:
  build-ios:
    name: Build iOS (macOS Runner)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        run: |
          flutter --version
          xcodebuild -version

      - name: Install Dependencies
        run: flutter pub get

      - name: CocoaPods Setup
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS Simulator App (.app)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_target == 'simulator' }}
        run: |
          flutter build ios --simulator --no-codesign

      - name: Build iOS Release (No Codesign)
        if: ${{ inputs.build_target == 'release-no-codesign' }}
        run: |
          flutter build ios --release --no-codesign

      - name: Compress Simulator Build Artifact
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_target == 'simulator' }}
        run: |
          cd build/ios/iphonesimulator
          tar -czvf Runner.app.tar.gz Runner.app
          cd ../../..

      - name: Upload iOS Simulator Build
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_target == 'simulator' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: build/ios/iphonesimulator/Runner.app.tar.gz
          retention-days: 14
